  <!-- Light / dark choice before the first paint (admin.js keeps it in localStorage) -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('od-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/css/fx.css">
  <script>/* A skipped page transition must not log an uncaught error. */['pageswap','pagereveal'].forEach(function(n){addEventListener(n,function(e){var v=e.viewTransition;if(v)[v.ready,v.finished,v.updateCallbackDone].forEach(function(p){if(p)p.catch(function(){});});});});</script>
